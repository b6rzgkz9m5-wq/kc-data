<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="招标信息">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%20%22%E5%8B%98%E5%AF%9F%E6%8B%9B%E6%A0%87%E4%BF%A1%E6%81%AF%22%2C%20%22short_name%22%3A%20%22%E6%8B%9B%E6%A0%87%E4%BF%A1%E6%81%AF%22%2C%20%22display%22%3A%20%22standalone%22%2C%20%22background_color%22%3A%20%22%23f2f5f9%22%2C%20%22theme_color%22%3A%20%22%231d4ed8%22%7D">
<title>勘察招标信息 · 手机版</title>
<style>
:root{--primary:#1d4ed8;--bg:#f2f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--plan:#f59e0b;--active:#16a34a;--warn:#dc2626;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 16px);}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#1d4ed8,#3b82f6);padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;color:#fff;box-shadow:0 2px 10px rgba(29,78,216,.25);}
.htop{display:flex;align-items:center;justify-content:space-between;}
.htitle{font-size:18px;font-weight:700;}
.hsub{font-size:11px;opacity:.85;margin-top:2px;}
.refresh{background:#fff;color:var(--primary);border:none;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px;}
.refresh:active{transform:scale(.96);}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;}
.tab{flex:1;text-align:center;padding:12px 0;font-size:14px;color:var(--muted);font-weight:600;position:relative;}
.tab.on{color:var(--primary);}
.tab.on::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:3px;background:var(--primary);border-radius:3px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 12px 4px;}
.stat{background:var(--card);border-radius:12px;padding:10px 4px;text-align:center;box-shadow:0 1px 4px rgba(15,23,42,.06);}
.stat .num{display:block;font-size:18px;font-weight:800;line-height:1.1;}
.stat .lab{display:block;font-size:11px;color:var(--muted);margin-top:3px;}
.panel{padding:0 12px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:9px 10px;white-space:nowrap;}\n.srclabel{font-size:12px;color:var(--muted);padding:6px 12px 0;font-weight:700;}
.chip{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:18px;padding:6px 13px;font-size:13px;flex:none;}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.card{background:var(--card);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:0 1px 5px rgba(15,23,42,.07);}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
.idx{font-size:12px;color:var(--muted);min-width:20px;}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.badge.plan{background:#fef3c7;color:#b45309;}
.badge.warn{background:#fee2e2;color:#b91c1c;}
.badge.st{color:#fff;}
.watch{margin-left:auto;font-size:18px;color:#fbbf24;background:none;border:none;padding:0 2px;}
.code{font-weight:700;font-size:13px;color:var(--primary);}
.name{font-size:15px;font-weight:700;line-height:1.35;margin:2px 0 8px;}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-bottom:5px;}
.meta .cat{background:#eff6ff;color:var(--primary);padding:1px 8px;border-radius:8px;font-weight:600;}
.meta2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#334155;margin-top:3px;}
.meta2 .urgent{color:var(--warn);font-weight:700;}
.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.detail.open{display:block;}
.dr{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px solid #f1f5f9;}
.dr span{color:var(--muted);}
.dr b{font-weight:600;text-align:right;}
.att{background:#fff7ed;color:#9a3412;font-size:12px;padding:8px;border-radius:8px;margin-top:8px;line-height:1.4;}
.link{display:inline-block;margin-top:9px;color:var(--primary);font-size:13px;font-weight:600;text-decoration:none;}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:80%;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="htop">
    <div class="htxt"><div class="htitle">勘察招标信息</div><div class="hsub">数据更新：<span id="upd"></span>　·　上次刷新：<span id="lref">—</span></div></div>
    <button class="refresh" onclick="refresh()">↻ 刷新</button>
  </div>
</header>
<nav class="tabs">
  <div class="tab on" id="tabTender" onclick="switchTab('tender')">招标信息</div>
  <div class="tab" id="tabLand" onclick="switchTab('land')">深圳土拍</div>
</nav>
<section class="stats" id="stats"></section>
<div class="panel" id="panelTender">
  <div class="srclabel">按来源分类</div>
  <div class="chips" id="srcChips"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<div class="panel" id="panelLand" style="display:none">
  <div class="chips" id="landFilters"></div>
  <section class="stats" id="landStats" style="padding-top:4px"></section>
  <div id="landList"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const LAND_DATA = [];


const PROJECTS_DATA = [];

/* ============================================================
   常量
   ============================================================ */

const LAST_UPDATE = "2026-08-15 10:00";

const $ = s => document.querySelector(s);
let currentTab = "tender";
let filterCat = "all";
let srcFilter = "all";
let landFilter = "all";

function statusText(s){return {active:"投标中",ended:"已截止",plan:"预告中"}[s]||s;}
function sourceOf(p){
  const t=(p.org||"")+(p.name||"");
  if(/街道|办事处|社区|股份合作|集体资产|城中村|旧改|居委会|社区工作站|集体/.test(t)) return "街道办";
  if(/集团|有限公司|投资|置业|安居|建发|地铁|机场|能源|盐田港|招商|鹏泰|深汕|特区建发|国资|股份|产发|城发|海星|特发|华润|万科|比亚迪|人才安居|产业|发展有限公司|码头|港务|电投|电网|电力/.test(t)) return "国企";
  return "交易中心";
}
function srcColor(s){return s==="街道办"?"#0891b2":s==="国企"?"#7c3aed":"#1d4ed8";}
function isWarn(p){return (p.attention||"").indexOf("待核实")>=0;}
function fmtDate(d){return d?String(d).slice(0,10):"—";}
function getCountdown(p){
  if(p.status!=="active"||!p.deadlineDate) return null;
  const diff = new Date(p.deadlineDate+"T00:00:00") - new Date();
  if(diff<0) return {text:"已截止",urgent:true};
  const days=Math.floor(diff/86400000);
  return {text:"剩 "+days+" 天",urgent:days<=3};
}
const watched = {};
try{Object.assign(watched, JSON.parse(localStorage.getItem("mobile_watch")||"{}"));}catch(e){}

function renderStats(){
  const all=PROJECTS_DATA;
  const cnt=s=>all.filter(p=>sourceOf(p)===s).length;
  const land=LAND_DATA.filter(l=>l.status==="done").length;
  const cards=[
    {n:cnt("交易中心"),t:"交易中心",c:"#1d4ed8"},
    {n:cnt("国企"),t:"国企",c:"#7c3aed"},
    {n:cnt("街道办"),t:"街道办",c:"#0891b2"},
    {n:land,t:"土拍成交",c:"var(--primary)"}
  ];
  $("#stats").innerHTML=cards.map(s=>`<div class="stat"><span class="num" style="color:${s.c}">${s.n}</span><span class="lab">${s.t}</span></div>`).join("");
}

function renderSrcChips(){
  const srcs=["all","交易中心","国企","街道办"];
  $("#srcChips").innerHTML=srcs.map(s=>`<span class="chip ${srcFilter===s?'on':''}" onclick="setSrc('${s}')">${s==='all'?'全部来源':s}</span>`).join("");
}
function renderChips(){
  const cats=["all","plan","active","ended"].filter(c=>c==="all"||PROJECTS_DATA.some(p=>p.status===c));
  const names={all:"全部",active:"投标中",plan:"预告中",ended:"已截止"};
  let h=`<span class="chip ${filterCat==='all'?'on':''}" onclick="setFilter('all')">全部</span>`;
  ["plan","active","ended"].forEach(s=>{ if(cats.includes(s)) h+=`<span class="chip ${filterCat===s?'on':''}" onclick="setFilter('${s}')">${names[s]}</span>`;});
  h+=`<span class="chip ${filterCat==='warn'?'on':''}" onclick="setFilter('warn')">待核实</span>`;
  h+=`<span class="chip ${filterCat==='watched'?'on':''}" onclick="setFilter('watched')">★ 我的收藏</span>`;
  $("#chips").innerHTML=h;
}
function setFilter(c){filterCat=c;renderChips();renderList();}
function setSrc(s){srcFilter=s;renderSrcChips();renderList();}

function renderList(){
  let list=PROJECTS_DATA.filter(p=>{
    if(srcFilter!=="all" && sourceOf(p)!==srcFilter) return false;
    if(filterCat==="all")return true;
    if(filterCat==="warn")return isWarn(p);
    if(filterCat==="watched")return !!watched[p.id];
    return p.status===filterCat;
  });
  list.sort((a,b)=>(Number(!!b.isPlan)-Number(!!a.isPlan))|| (b.date||"").localeCompare(a.date||""));
  if(!list.length){$("#list").innerHTML='<div class="empty">'+(filterCat==="watched"?"暂无收藏，点击卡片右上角 ☆ 即可收藏":"暂无符合条件的项目")+'</div>';return;}
  $("#list").innerHTML=list.map((p,i)=>{
    const st=statusText(p.status);
    const stColor=p.status==="plan"?"var(--plan)":p.status==="active"?"var(--active)":"var(--muted)";
    const warn=isWarn(p);
    const cd=getCountdown(p);
    const w=watched[p.id]?"★":"☆";
    const detailRows=p.detail?Object.entries(p.detail).map(([k,v])=>`<div class="dr"><span>${k}</span><b>${v||"—"}</b></div>`).join(""):"";
    return `<div class="card" onclick="toggleDetail('${p.id}')">
      <div class="crow">
        <span class="idx">${i+1}</span>
        ${p.isPlan?'<span class="badge plan">📋 招标计划</span>':''}
        ${warn?'<span class="badge warn">⚠ 待核实</span>':''}
        <span class="badge st" style="background:${srcColor(sourceOf(p))}">${sourceOf(p)}</span>
        <span class="badge st" style="background:${stColor}">${st}</span>
        <span class="watch" onclick="event.stopPropagation();toggleWatch('${p.id}')">${w}</span>
      </div>
      <div class="name">${p.name}</div>
      <div class="meta"><span class="cat">${p.category||"—"}</span><span>🏢 ${p.org||"—"}</span></div>
      <div class="meta2"><span>📅 ${fmtDate(p.date)}</span><span>💰 ${p.budget||"—"}</span>${cd?`<span class="${cd.urgent?'urgent':''}">⏳ ${cd.text}</span>`:''}</div>
      <div class="detail" id="d_${p.id}">
        ${detailRows?`<div class="dblock">${detailRows}</div>`:''}
        ${p.attention?`<div class="att">${p.attention}</div>`:''}
        ${p.link?`<a class="link" href="${p.link}" target="_blank" onclick="event.stopPropagation()">查看官方详情 ↗</a>`:''}
      </div>
    </div>`;
  }).join("");
}
function toggleDetail(id){const el=document.getElementById("d_"+id);if(el)el.classList.toggle("open");}
function toggleWatch(id){watched[id]=!watched[id];localStorage.setItem("mobile_watch",JSON.stringify(watched));renderList();}

function renderLandStats(){
  const done=LAND_DATA.filter(l=>l.status==="done");
  const area=done.reduce((s,l)=>s+(l.area||0),0);
  const price=done.reduce((s,l)=>s+(l.dealPrice||0),0);
  const fmtP=w=>w>0?(w>=10000?(w/10000).toFixed(1)+"亿":"¥"+w.toLocaleString()+"万"):"—";
  const fmtA=a=>a>0?(a>=10000?(a/10000).toFixed(2)+"万㎡":a.toLocaleString()+"㎡"):"—";
  $("#landStats").innerHTML=[
    {n:done.length+"宗",t:"已成交"},
    {n:fmtA(area),t:"成交面积"},
    {n:fmtP(price),t:"成交金额"},
    {n:LAND_DATA.length+"宗",t:"地块总数"}
  ].map(s=>`<div class="stat"><span class="num" style="color:var(--primary)">${s.n}</span><span class="lab">${s.t}</span></div>`).join("");
}
function renderLandFilters(){
  const ds=["all",...new Set(LAND_DATA.map(l=>l.district))];
  $("#landFilters").innerHTML=ds.map(d=>`<span class="chip ${landFilter===d?'on':''}" onclick="setLandFilter('${d}')">${d==='all'?'全部区域':d}</span>`).join("");
}
const landST={done:"已成交",listing:"挂牌中",plan:"预告"};
function renderLand(){
  let list=LAND_DATA.filter(l=>landFilter==="all"||l.district===landFilter);
  list.sort((a,b)=>(b.dealDate||"").localeCompare(a.dealDate||""));
  if(!list.length){$("#landList").innerHTML='<div class="empty">暂无地块</div>';return;}
  const fmtP=w=>w>0?(w>=10000?(w/10000).toFixed(1)+"亿":"¥"+w.toLocaleString()+"万"):"—";
  const fmtA=a=>a>0?a.toLocaleString()+"㎡":"—";
  $("#landList").innerHTML=list.map(l=>`
    <div class="card">
      <div class="crow"><span class="code">${l.code}</span><span class="badge st" style="background:${l.status==='done'?'var(--active)':l.status==='plan'?'var(--plan)':'var(--primary)'}">${landST[l.status]}</span></div>
      <div class="name">${l.name}</div>
      <div class="meta"><span class="cat">${l.district}</span><span>${l.use}</span><span>${l.method}</span></div>
      <div class="meta2"><span>📐 ${fmtA(l.area)}</span><span>💰 ${fmtP(l.dealPrice)}</span></div>
      <div class="meta2"><span>🏆 ${l.winner||"—"}</span><span>📅 ${l.dealDate||"—"}</span></div>
      ${l.link?`<a class="link" href="${l.link}" target="_blank">查看 ↗</a>`:''}
    </div>`).join("");
}
function setLandFilter(d){landFilter=d;renderLandFilters();renderLand();}

function switchTab(t){
  currentTab=t;
  $("#tabTender").classList.toggle("on",t==="tender");
  $("#tabLand").classList.toggle("on",t==="land");
  $("#panelTender").style.display=t==="tender"?"block":"none";
  $("#panelLand").style.display=t==="land"?"block":"none";
  localStorage.setItem("mobile_tab",t);
}

let toastTimer;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1900);}

function loadCache(silent){
  try{
    const c=localStorage.getItem("kc_cache");
    if(c){const d=JSON.parse(c);
      PROJECTS_DATA.length=0;PROJECTS_DATA.push.apply(PROJECTS_DATA,d.projects||[]);
      LAND_DATA.length=0;LAND_DATA.push.apply(LAND_DATA,d.land||[]);
      if(d.update)LAST_UPDATE=d.update;renderAll();
      if(!silent) toast("离线缓存：显示最近一次数据");return;
    }
  }catch(e){}
  if(!silent) toast("离线模式：数据每日 10:00 自动更新");
}
function refresh(silent){
  if(!silent) toast("刷新中…");
  const s=document.createElement("script");
  s.src="./data.js?_="+(+new Date());
  s.onload=function(){
    if(window.__DATA__ && window.__DATA__.projects){
      PROJECTS_DATA.length=0;
      PROJECTS_DATA.push.apply(PROJECTS_DATA, window.__DATA__.projects);
      if(window.__DATA__.land){LAND_DATA.length=0;LAND_DATA.push.apply(LAND_DATA,window.__DATA__.land);}
      if(window.__DATA__.update)LAST_UPDATE=window.__DATA__.update;
      try{localStorage.setItem("kc_cache", JSON.stringify(window.__DATA__));}catch(e){}
      var _d=new Date();localStorage.setItem("lastRefresh",(_d.getMonth()+1)+"-"+_d.getDate()+" "+String(_d.getHours()).padStart(2,"0")+":"+String(_d.getMinutes()).padStart(2,"0"));
      renderAll();
      if(!silent) toast("已更新到最新");
    }else{ loadCache(silent); }
    s.remove();
  };
  s.onerror=function(){ loadCache(silent); s.remove(); };
  document.head.appendChild(s);
}

let startY=0,pulling=0;
document.addEventListener("touchstart",e=>{startY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchmove",e=>{
  if(window.scrollY<=0 && e.touches[0].clientY-startY>70 && !pulling){pulling=1;refresh();}
},{passive:true});
document.addEventListener("touchend",()=>{pulling=0;});

function renderAll(){
  renderStats();renderSrcChips();renderChips();renderList();
  renderLandStats();renderLandFilters();renderLand();
  $("#upd").textContent=LAST_UPDATE;
  $("#lref").textContent=localStorage.getItem("lastRefresh")||"—";
}
renderAll();
try{const st=localStorage.getItem("mobile_tab");if(st)switchTab(st);}catch(e){}
refresh(true);
</script>
</body>
</html>
